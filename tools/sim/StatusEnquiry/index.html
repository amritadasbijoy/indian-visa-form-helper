<!doctype html>
<!-- Dev-only stand-in for the site's "Visa Status Enquiry" page (field ids from the live site, Nov 2026).
     Submitting goes to ?result=1, which shows a made-up result table for the Application Id typed. -->
<html><head><meta charset="utf-8"><title>Sim StatusEnquiry</title>
<script src="/tools/chrome-mock.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body>
<div id="result"></div>
<form action="StatusEnquiry" method="post" onsubmit="return validate_status_enq_form();">
Application Id <input name="filerfno" type="text" maxlength="12" id="application_id"> Enter 12 characters application ID<br>
Passport No <input name="passport_number" type="text" maxlength="14" id="passport_no"><br>
<input type="text" name="captcha" id="captcha"> Please enter above text<br>
<input name="submit_btn" type="submit" value="Submit">
</form>
<script>
window.validate_status_enq_form = () => document.getElementById('application_id').value.length === 12;
const q = new URLSearchParams(location.search);
if (q.get('result')) document.getElementById('result').innerHTML = '<table><tr><td>Application Id</td><td>' + q.get('result') + '</td></tr><tr><td>Name</td><td>RINA DAS</td></tr><tr><td>Passport Status</td><td>Process Initiated</td></tr></table>';
// Runs after the extension's submit listener (added later than the page's own scripts would run).
setTimeout(() => document.querySelector('form').addEventListener('submit', e => {
  e.preventDefault();
  const id = document.getElementById('application_id').value;
  setTimeout(() => { location.href = '?result=' + id; }, 200);
}), 3000);
</script>
<script src="/extension/shared/constants.js"></script>
<script src="/extension/shared/util.js"></script>
<script src="/extension/shared/i18n.js"></script>
<script src="/extension/content/pages.js"></script>
<script src="/extension/content/bridge.js"></script>
<script src="/extension/content/content.js"></script>
</body></html>
