<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store promo tile</title>
<!-- 440×280 small promo tile for the Chrome Web Store. -->
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
    background: radial-gradient(500px 320px at 0% 0%, #1f6fd1 0%, #0b3d82 60%, #082a5c 100%);
    display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  img { width: 64px; height: 64px; }
  .tag { font-size: 13px; background: rgba(255,255,255,.16); padding: 5px 10px; border-radius: 999px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; font-weight: 750; }
  p { margin: 0; font-size: 15px; color: #cfe0f8; }
</style>
</head>
<body>
  <div class="top"><img src="/extension/icons/icon128.png" alt=""><span class="tag">Bangladesh · Tourist & Medical</span></div>
  <h1>Indian Visa<br>Form Helper</h1>
  <p>Fill every page from saved details. Unofficial.</p>
</body>
</html>
